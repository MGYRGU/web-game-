<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Shooting Game - Phase 3</title>
    <style>
        /* =========================================
           ベーススタイルとレイアウトの堅牢化
        ========================================= */
        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }

        /* 1. ゲームレイヤー (描画専用) */
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            display: block;
        }

        /* 2. UIレイヤー (UI・スコア・デバッグ表示専用) */
        #uiLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* =========================================
           Phase 4: UI画面(タイトル、ゲームオーバー、スコア)のスタイル
        ========================================= */
        #scoreDisplay {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            pointer-events: none;
            display: none; /* プレイ中のみ表示 */
        }

        .screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto; /* ボタンクリックを許可 */
            transition: opacity 0.3s ease;
        }

        .screen-overlay h1 {
            font-size: 48px;
            color: #38bdf8;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
            text-align: center;
            letter-spacing: 2px;
        }

        .screen-overlay p {
            font-size: 18px;
            color: #cbd5e1;
            margin-bottom: 30px;
        }

        .btn {
            padding: 15px 40px;

        /* =========================================
           デバッグUIのスタイル

        #debugUI {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: rgba(15, 23, 42, 0.9);
            border: 1px solid #ef4444;
            border-radius: 8px;
            padding: 12px;
            width: 90%;
            max-width: 400px;

            pointer-events: auto;

            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.5);
        }

        .debug-header {
            color: #f87171;
            font-weight: bold;

            margin-bottom: 8px;

</head>
<body>

    <!-- 描画用キャンバス -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI用レイヤー -->
    <div id="uiLayer">
        <!-- Phase 4: スコアと各画面UIの追加 -->
        <div id="scoreDisplay">Score: 0</div>

        <!-- タイトル画面 -->
        <div id="titleScreen" class="screen-overlay">
            <h1>Neon Shooter</h1>
            <p>Drag or Arrow Keys to Move (Auto-fire)</p>
            <button id="startBtn" class="btn">START GAME</button>
        </div>

        <!-- ゲームオーバー画面 -->
        <div id="gameOverScreen" class="screen-overlay hidden">
            <h1 style="color: #ef4444; text-shadow: 0 0 15px rgba(239, 68, 68, 0.6);">GAME OVER</h1>
            <p id="finalScoreText">Score: 0</p>
            <button id="restartBtn" class="btn">RESTART</button>
        </div>

        <!-- デバッグ画面コンテナ -->
        <div id="debugUI">
            <div class="debug-header">
                <span>⚠️ Runtime Error Detected</span>
            </div>
            <div id="debugContent"></div>
        </div>
    </div>

    <!-- JavaScript ロジック -->
    <script>
        /**
         * 1. デバッグ＆エラーハンドリング システム
         */
        const debugUI = document.getElementById('debugUI');
        const debugContent = document.getElementById('debugContent');

        function displayError(message, source, lineno, colno) {
            debugUI.style.display = 'block';
            const el = document.createElement('div');
            el.className = 'debug-error-item';
            let text = `<strong>Error:</strong> ${message}`;
            if (source) {
                const filename = source.split('/').pop() || 'inline script';
                text += `<br><span style="color: #94a3b8; font-size: 10px;">Location: ${filename} at line ${lineno}:${colno}</span>`;
            }
            el.innerHTML = text;
            debugContent.appendChild(el);
            debugUI.scrollTop = debugUI.scrollHeight;
        }

        window.onerror = function(message, source, lineno, colno, error) {
            displayError(message, source, lineno, colno);
            return false; 
        };

        window.addEventListener('unhandledrejection', function(event) {
            displayError(`Unhandled Promise: ${event.reason}`, 'Promise', 0, 0);
        });

        /**
         * 2. キャンバスのセットアップ
         */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        /**
         * 2.5 レトロサウンドシステム (Web Audio API)
         * 外部ファイルを使わず、オシレーターで波形を生成して音を鳴らします。
         */
        let audioCtx;
        let bgmInterval;
        
        function initAudio() {
            if (!audioCtx) {
                // ブラウザの互換性を考慮したAudioContextの生成
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            // ユーザーの操作後に再開する
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        const Sound = {
            playShoot: () => {
                if (!audioCtx || audioCtx.state !== 'running') return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.02, audioCtx.currentTime); // 音量控えめ
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            },
            playDamage: () => {
                if (!audioCtx || audioCtx.state !== 'running') return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            },
            playExplosion: () => {
                if (!audioCtx || audioCtx.state !== 'running') return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            },
            playGameOver: () => {
                if (!audioCtx || audioCtx.state !== 'running') return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 1.0);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 1.0);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 1.0);
            },
            startBGM: () => {
                Sound.stopBGM();
                // 8bit風のシンプルなベースラインの周波数配列
                const notes = [220, 0, 261.63, 293.66, 329.63, 0, 392.00, 329.63];
                let noteIndex = 0;
                bgmInterval = setInterval(() => {
                    if (!audioCtx || audioCtx.state !== 'running') return;
                    if (notes[noteIndex] > 0) {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.value = notes[noteIndex];
                        gain.gain.setValueAtTime(0.03, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                        osc.connect(gain); gain.connect(audioCtx.destination);
                        osc.start(); osc.stop(audioCtx.currentTime + 0.15);
                    }
                    noteIndex = (noteIndex + 1) % notes.length;
                }, 150); // 150msごとに音を鳴らすループ
            },
            stopBGM: () => {
                if (bgmInterval) clearInterval(bgmInterval);
            }
        };

        /**
         * 3. 入力管理クラス
         */
        class InputManager {
            constructor() {
                this.keys = {};
                this.touchState = { active: false, x: 0, y: 0, dx: 0, dy: 0, lastX: 0, lastY: 0 };

                window.addEventListener('keydown', (e) => { this.keys[e.code] = true; });
                window.addEventListener('keyup', (e) => { this.keys[e.code] = false; });

                canvas.addEventListener('touchstart', (e) => this.handleTouchStart(e), { passive: false });
                canvas.addEventListener('touchmove', (e) => this.handleTouchMove(e), { passive: false });
                canvas.addEventListener('touchend', (e) => this.handleTouchEnd(e));
                
                canvas.addEventListener('mousedown', (e) => this.handleMouseDown(e));
                canvas.addEventListener('mousemove', (e) => this.handleMouseMove(e));
                canvas.addEventListener('mouseup', (e) => this.handleMouseEnd(e));
                canvas.addEventListener('mouseleave', (e) => this.handleMouseEnd(e));
            }

            handleTouchStart(e) {
                e.preventDefault(); 
                this.touchState.active = true;
                this.touchState.lastX = e.touches[0].clientX;
                this.touchState.lastY = e.touches[0].clientY;
                this.touchState.dx = 0; this.touchState.dy = 0;
            }

            handleTouchMove(e) {
                e.preventDefault();
                if (!this.touchState.active) return;
                this.touchState.dx = e.touches[0].clientX - this.touchState.lastX;
                this.touchState.dy = e.touches[0].clientY - this.touchState.lastY;
                this.touchState.lastX = e.touches[0].clientX;
                this.touchState.lastY = e.touches[0].clientY;
            }

            handleTouchEnd(e) { this.touchState.active = false; this.touchState.dx = 0; this.touchState.dy = 0; }

            handleMouseDown(e) {
                this.touchState.active = true;
                this.touchState.lastX = e.clientX;
                this.touchState.lastY = e.clientY;
                this.touchState.dx = 0; this.touchState.dy = 0;
            }

            handleMouseMove(e) {
                if (!this.touchState.active) return;
                this.touchState.dx = e.clientX - this.touchState.lastX;
                this.touchState.dy = e.clientY - this.touchState.lastY;
                this.touchState.lastX = e.clientX;
                this.touchState.lastY = e.clientY;
            }

            handleMouseEnd(e) { this.touchState.active = false; this.touchState.dx = 0; this.touchState.dy = 0; }

            getMovement() {
                let dx = 0, dy = 0;
                if (this.keys['ArrowUp'] || this.keys['KeyW']) dy -= 1;
                if (this.keys['ArrowDown'] || this.keys['KeyS']) dy += 1;
                if (this.keys['ArrowLeft'] || this.keys['KeyA']) dx -= 1;
                if (this.keys['ArrowRight'] || this.keys['KeyD']) dx += 1;

                if (this.touchState.active && (this.touchState.dx !== 0 || this.touchState.dy !== 0)) {
                    dx = this.touchState.dx; dy = this.touchState.dy;
                    this.touchState.dx = 0; this.touchState.dy = 0;
                    return { dx, dy, isTouch: true };
                }

                if (dx !== 0 && dy !== 0) {
                    const length = Math.sqrt(dx * dx + dy * dy);
                    dx /= length; dy /= length;
                }
                return { dx, dy, isTouch: false };
            }
        }

        /**
         * =========================================
         * Phase 3: エンティティ基底クラスと各種オブジェクト
         * =========================================
         */

        // 基底クラス: 座標、サイズ、削除フラグなどの共通要素を管理
        class Entity {
            constructor(x, y, width, height) {
                this.x = x;
                this.y = y;
                this.width = width;
                this.height = height;
                this.markedForDeletion = false; // trueになると次フレームで配列から消去される
            }
        }

        // 弾クラス
        class Bullet extends Entity {
            constructor(x, y) {
                super(x, y, 6, 20); // 弾の幅と高さ
                this.speed = 12;
                this.color = '#fde047'; // 黄色
            }

            update() {
                this.y -= this.speed; // 上に向かって飛ぶ
                // 画面上部から完全にはみ出したら削除フラグを立てる
                if (this.y + this.height < 0) {
                    this.markedForDeletion = true;
                }
            }

            draw(ctx) {
                ctx.fillStyle = this.color;
                // 中心を基準にして描画
                ctx.fillRect(this.x - this.width / 2, this.y - this.height / 2, this.width, this.height);
                
                // 少し光るエフェクト（見た目の向上）
                ctx.fillStyle = 'rgba(253, 224, 71, 0.4)';
                ctx.fillRect(this.x - this.width, this.y - this.height / 2 + 5, this.width * 2, this.height - 10);
            }
        }

        // 敵クラス
        class Enemy extends Entity {
            constructor(x, y) {
                super(x, y, 35, 35);
                // 敵によって落ちる速度をランダムにする
                this.speed = 1.5 + Math.random() * 2; // 耐久があるため少し遅く調整
                
                // 耐久力(HP)を追加
                this.maxHp = 3;
                this.hp = this.maxHp;
            }

            update(canvasHeight) {
                this.y += this.speed; // 下に向かって落ちる
                // 画面下部から完全にはみ出したら削除フラグを立てる
                if (this.y - this.height > canvasHeight) {
                    this.markedForDeletion = true;
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // HPに応じて色を変化させる（ダメージを受けると暗い赤になる）
                const lightness = 30 + (this.hp / this.maxHp) * 30; // 30% ~ 60%
                ctx.fillStyle = `hsl(0, 80%, ${lightness}%)`;

                // ひし形のUFO風の敵
                ctx.beginPath();
                ctx.moveTo(0, -this.height / 2);
                ctx.lineTo(this.width / 2, 0);
                ctx.lineTo(0, this.height / 2);
                ctx.lineTo(-this.width / 2, 0);
                ctx.closePath();
                ctx.fill();

                // 中央のコア
                ctx.fillStyle = '#1e293b';
                ctx.beginPath();
                ctx.arc(0, 0, this.width / 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        // 自機クラス (Phase 3: 発射機能の追加)
        class Player extends Entity {
            constructor(x, y) {
                super(x, y, 40, 40);
                this.speed = 6;
                this.color = '#38bdf8';
                
                // 射撃用タイマー
                this.shootInterval = 10; // 10フレームに1回発射（1秒間に約6発）
                this.shootTimer = 0;
            }

            // 更新処理に bullets 配列を引数として受け取る
            update(inputManager, canvasWidth, canvasHeight, bullets) {
                const move = inputManager.getMovement();
                
                if (move.isTouch) {
                    this.x += move.dx; this.y += move.dy;
                } else {
                    this.x += move.dx * this.speed; this.y += move.dy * this.speed;
                }

                const halfW = this.width / 2;
                const halfH = this.height / 2;
                if (this.x < halfW) this.x = halfW;
                if (this.x > canvasWidth - halfW) this.x = canvasWidth - halfW;
                if (this.y < halfH) this.y = halfH;
                if (this.y > canvasHeight - halfH) this.y = canvasHeight - halfH;

                // オート射撃の処理
                this.shootTimer++;
                if (this.shootTimer >= this.shootInterval) {
                    // 機首（機体の上部）から弾を生成
                    bullets.push(new Bullet(this.x, this.y - halfH));
                    Sound.playShoot(); // 弾の発射音を鳴らす
                    this.shootTimer = 0; // タイマーリセット
                }
            }

            draw(ctx) {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // 機体の描画
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.moveTo(0, -this.height / 2); // 機首
                ctx.lineTo(this.width / 2, this.height / 2); // 右翼
                ctx.lineTo(0, this.height / 4); // 後部中央
                ctx.lineTo(-this.width / 2, this.height / 2); // 左翼
                ctx.closePath();
                ctx.fill();

                // キャノピー(窓)
                ctx.fillStyle = '#f8fafc';
                ctx.beginPath();
                ctx.arc(0, -this.height / 8, this.width / 8, 0, Math.PI * 2);
                ctx.fill();
                
                // エンジンの炎
                ctx.fillStyle = '#f97316';
                ctx.beginPath();
                ctx.moveTo(-this.width / 4, this.height / 4 + 2);
                ctx.lineTo(0, this.height / 2 + Math.random() * 15);
                ctx.lineTo(this.width / 4, this.height / 4 + 2);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }
        }

        /**
         * 4. ゲーム管理（エンティティ配列の導入）
         */
        const input = new InputManager();
        let player = new Player(canvas.width / 2, canvas.height - 100);
        
        // オブジェクトを一元管理する配列
        let bullets = [];
        let enemies = [];
        
        // 敵の発生間隔を管理するカウンター
        let frameCount = 0;

        // =========================================
        // Phase 4: ゲームステート、スコア、UI制御
        // =========================================
        let gameState = 'TITLE'; // 'TITLE', 'PLAYING', 'GAMEOVER'
        let score = 0;

        const scoreDisplay = document.getElementById('scoreDisplay');
        const titleScreen = document.getElementById('titleScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScoreText = document.getElementById('finalScoreText');

        // ボタンのイベントリスナー
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('restartBtn').addEventListener('click', startGame);

        function startGame() {
            // オーディオの初期化とBGMの再生開始
            initAudio();
            Sound.startBGM();

            // ゲームの初期化
            score = 0;
            scoreDisplay.innerText = `Score: ${score}`;
            bullets = [];
            enemies = [];
            player = new Player(canvas.width / 2, canvas.height - 100);
            frameCount = 0;
            
            // UIの切り替え
            titleScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            scoreDisplay.style.display = 'block';
            
            gameState = 'PLAYING';
        }

        function gameOver() {
            gameState = 'GAMEOVER';
            
            // BGMを止めてゲームオーバー音を鳴らす
            Sound.stopBGM();
            Sound.playGameOver();

            scoreDisplay.style.display = 'none';
            finalScoreText.innerText = `Final Score: ${score}`;
            gameOverScreen.classList.remove('hidden');
        }

        // 円形当たり判定ヘルパー関数 (当たりやすさのスケール調整付き)
        function checkCollision(circle1, circle2, hitBoxScale = 0.8) {
            const dx = circle1.x - circle2.x;
            const dy = circle1.y - circle2.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            // width を直径とみなして半径を計算
            const radius1 = (circle1.width / 2) * hitBoxScale;
            const radius2 = (circle2.width / 2) * hitBoxScale;
            return distance < radius1 + radius2;
        }

        window.addEventListener('resize', () => {
            if (player) {
                player.x = Math.min(Math.max(player.x, player.width/2), canvas.width - player.width/2);
                player.y = Math.min(Math.max(player.y, player.height/2), canvas.height - player.height/2);
            }
        });

        // メインゲームループ
        function gameLoop() {
            // ==================
            // 1. ロジック更新 (PLAYING状態のみ)
            // ==================
            frameCount++;

            if (gameState === 'PLAYING') {
                // プレイヤーの更新
                player.update(input, canvas.width, canvas.height, bullets);

                // 敵のスポーン処理 (スコアが上がると発生間隔が少し短くなる)
                const spawnRate = Math.max(20, 60 - Math.floor(score / 500) * 5);
                if (frameCount % spawnRate === 0) {
                    const enemyWidth = 35;
                    const safeMargin = enemyWidth;
                    const randomX = Math.random() * (canvas.width - safeMargin * 2) + safeMargin;
                    enemies.push(new Enemy(randomX, -enemyWidth));
                }

                // 弾と敵の更新
                bullets.forEach(bullet => bullet.update());
                enemies.forEach(enemy => enemy.update(canvas.height));

                // ==================
                // Phase 4: 当たり判定処理
                // ==================
                // 弾 vs 敵
                bullets.forEach(bullet => {
                    enemies.forEach(enemy => {
                        if (!bullet.markedForDeletion && !enemy.markedForDeletion) {
                            if (checkCollision(bullet, enemy)) {
                                bullet.markedForDeletion = true; // 弾を消す
                                
                                // 敵のHPを減らす処理
                                enemy.hp -= 1;
                                if (enemy.hp <= 0) {
                                    enemy.markedForDeletion = true;  // HPが0なら敵を消す
                                    score += 100; // 撃破スコア加算
                                    Sound.playExplosion(); // 爆発音
                                } else {
                                    score += 10; // 命中スコア加算
                                    Sound.playDamage(); // ダメージ音
                                }
                                scoreDisplay.innerText = `Score: ${score}`;
                            }
                        }
                    });
                });

                // 自機 vs 敵
                enemies.forEach(enemy => {
                    if (!enemy.markedForDeletion) {
                        // 自機は判定を小さめ(0.6倍)にして避けやすく（遊びやすく）する
                        if (checkCollision(player, enemy, 0.6)) {
                            gameOver();
                        }
                    }
                });

                // ガベージコレクション (画面外・破壊されたオブジェクトを消去)
                bullets = bullets.filter(bullet => !bullet.markedForDeletion);
                enemies = enemies.filter(enemy => !enemy.markedForDeletion);
            }

            // ==================
            // 2. 描画処理
            // ==================
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 背景のグリッド線（ステートに関わらず動かし続ける）
            ctx.strokeStyle = 'rgba(30, 41, 59, 0.6)';
            ctx.lineWidth = 1;
            const offset = frameCount % 50; 
            for(let x = 0; x < canvas.width; x += 50) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for(let y = -50; y < canvas.height; y += 50) {
                ctx.beginPath(); ctx.moveTo(0, y + offset); ctx.lineTo(canvas.width, y + offset); ctx.stroke();
            }

            // 全エンティティの描画
            bullets.forEach(bullet => bullet.draw(ctx));
            enemies.forEach(enemy => enemy.draw(ctx));
            
            // プレイ中、またはゲームオーバー後も自機を表示する
            if (gameState !== 'TITLE') {
                player.draw(ctx);
            }

            // ==================
            // 3. 次のフレーム
            // ==================
            requestAnimationFrame(gameLoop);
        }

        // ゲーム開始
        gameLoop();
    </script>
</body>
</html>

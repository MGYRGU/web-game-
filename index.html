  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* CSS Variables & Base Setup */
    :root {
      --bg-color: #0b0d17;
      --accent-color: #00ffcc;
      --error-color: #ff3366;
      --warning-color: #ffaa00;
    }

    body {
      background-color: var(--bg-color);
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      margin: 0;
      padding: 0;
      overflow: hidden;
      touch-action: manipulation;
      user-select: none;

    /* ゲームCanvasの自動スケーリング設定 (3:4比率保持) */
    #canvas-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #151b2e 0%, #080910 100%);

      aspect-ratio: 3 / 4;
      display: block;
    }

    /* デバッグUI オーバーレイ */
    #debug-overlay {
      position: fixed;
      width: min(340px, 92vw);
      max-height: 280px;
      background: rgba(13, 16, 27, 0.92);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11px;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* 位置切り替え定義 */
    #debug-overlay.top-left     { top: 12px; left: 12px; }
    #debug-overlay.top-right    { top: 12px; right: 12px; }
    #debug-overlay.bottom-left  { bottom: 12px; left: 12px; }
    #debug-overlay.bottom-right { bottom: 12px; right: 12px; }

    /* エラー検知時の強調ボーダーとパルス */
    #debug-overlay.has-error {
      border-color: var(--error-color);
      box-shadow: 0 0 20px rgba(255, 51, 102, 0.4), 0 8px 24px rgba(0, 0, 0, 0.8);
      animation: errorShake 0.35s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes errorShake {
      10%, 90% { transform: translate3d(-1px, 0, 0); }
      20%, 80% { transform: translate3d(2px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-3px, 0, 0); }
      40%, 60% { transform: translate3d(3px, 0, 0); }

    #debug-header {
      padding: 6px 10px;

    /* エラーログ項目 */
    .debug-item {

    .debug-item pre {

    /* 最小化表示スタイル */

    #debug-overlay.minimized #debug-content,

    /* 操作ボタン */
    .dbg-btn {

  </style>
</head>
<body>

  <!-- ゲームキャンバスコンテナ -->
  <div id="canvas-container">
    <canvas id="gameCanvas" width="480" height="640"></canvas>
  </div>

  <!-- デバッグUI (初期位置: 左上 top-left) -->
  <div id="debug-overlay" class="top-left">
    <div id="debug-header">
      <div class="flex items-center gap-2">
        <span id="debug-status-badge" class="badge badge-ok">SYSTEM OK</span>
        <span class="text-xs text-slate-300 font-bold">DEBUG MONITOR</span>
      </div>
      <div class="flex items-center gap-1">
        <button id="btn-dbg-pos" class="dbg-btn" title="位置を切り替え (左上/右上/右下/左下)">⇄ 位置</button>
        <button id="btn-dbg-min" class="dbg-btn" title="最小化/展開">_</button>
        <button id="btn-dbg-clear" class="dbg-btn" title="ログ消去">×</button>
      </div>
    </div>
    <div id="debug-content">
      <div class="debug-item info">
        <div class="msg">Step 2 初期化完了</div>
        <div class="meta">自機操作 (WASD / 矢印 / タッチドラッグ) が有効です。</div>
      </div>
    </div>
    <div id="debug-footer" class="p-1 px-2.5 bg-white/5 border-t border-white/5 flex justify-between text-[9px] text-slate-400">
      <div class="flex gap-2">
        <span id="dbg-fps-text">FPS: 60</span>
        <span id="dbg-coords">POS: 240, 520</span>
      </div>
      <span id="dbg-pos-label">位置: top-left (F2で切替)</span>
    </div>
  </div>

  <!-- Step 1 動作検証用：エラー意図発生テストバー -->
  <div id="test-control-bar">
    <span class="text-[11px] text-slate-300 font-semibold hidden sm:inline">エラー捕捉テスト:</span>
    <button id="btn-test-undef" class="dbg-btn !bg-red-500/20 !border-red-400/40 hover:!bg-red-500/40 text-red-200">
      未定義変数 (ReferenceError)
    </button>
    <button id="btn-test-null" class="dbg-btn !bg-orange-500/20 !border-orange-400/40 hover:!bg-orange-500/40 text-orange-200">
      Null参照 (TypeError)
    </button>
    <button id="btn-test-promise" class="dbg-btn !bg-yellow-500/20 !border-yellow-400/40 hover:!bg-yellow-500/40 text-yellow-200">
      Promise拒否
    </button>
  </div>

  <script>
    /**
     * =========================================================================
     *  1. DEBUG MONITOR ENGINE
     *  最優先でロードし、以降の全スクリプトの構文・実行時エラーを捕捉する
     * =========================================================================
     */
    const DebugMonitor = {
      overlay: null,
      content: null,
      badge: null,
      posLabel: null,
      errorCount: 0,
      positions: ['top-left', 'top-right', 'bottom-right', 'bottom-left'],
      currentPosIdx: 0,

      init() {
        this.overlay = document.getElementById('debug-overlay');
        this.content = document.getElementById('debug-content');
        this.badge = document.getElementById('debug-status-badge');
        this.posLabel = document.getElementById('dbg-pos-label');

        this.bindEvents();
        this.installGlobalHandlers();
      },

      bindEvents() {
        // 位置切り替えボタン
        document.getElementById('btn-dbg-pos').addEventListener('click', () => this.cyclePosition());
        
        // 最小化トグル
        document.getElementById('btn-dbg-min').addEventListener('click', () => {
          this.overlay.classList.toggle('minimized');
        });

        // ログ消去ボタン
        document.getElementById('btn-dbg-clear').addEventListener('click', () => this.clearLogs());

        // ショートカットキー (F2で位置切替)
        window.addEventListener('keydown', (e) => {
          if (e.key === 'F2') {
            e.preventDefault();
            this.cyclePosition();
          }
        });
      },

      cyclePosition() {
        this.overlay.classList.remove(this.positions[this.currentPosIdx]);
        this.currentPosIdx = (this.currentPosIdx + 1) % this.positions.length;
        const newPos = this.positions[this.currentPosIdx];
        this.overlay.classList.add(newPos);
        if (this.posLabel) {
          this.posLabel.textContent = `位置: ${newPos} (F2で切替)`;
        }
      },

      clearLogs() {
        this.content.innerHTML = '';
        this.errorCount = 0;
        this.overlay.classList.remove('has-error');
        this.badge.className = 'badge badge-ok';
        this.badge.textContent = 'SYSTEM OK';
      },

      // エラー発生時のUI描画
      reportError(title, detail, source = '', lineno = '', colno = '', stack = '') {
        this.errorCount++;
        this.overlay.classList.add('has-error');
        this.badge.className = 'badge badge-err';
        this.badge.textContent = `${this.errorCount} ERROR${this.errorCount > 1 ? 'S' : ''}`;

        // 最小化されていたら自動展開
        this.overlay.classList.remove('minimized');

        const item = document.createElement('div');
        item.className = 'debug-item error';

        const fileName = source ? source.split('/').pop().split('?')[0] : 'inline';
        const loc = lineno ? `[${fileName}:${lineno}:${colno}]` : '';

        item.innerHTML = `
          <div class="msg">${this.escape(title)}</div>
          <div class="meta text-red-300 font-mono">${this.escape(detail)} ${loc}</div>
          ${stack ? `<pre>${this.escape(stack)}</pre>` : ''}
        `;

        this.content.appendChild(item);
        this.content.scrollTop = this.content.scrollHeight;
      },

      reportInfo(msg, meta = '') {
        const item = document.createElement('div');
        item.className = 'debug-item info';
        item.innerHTML = `
          <div class="msg">${this.escape(msg)}</div>
          ${meta ? `<div class="meta">${this.escape(meta)}</div>` : ''}
        `;
        this.content.appendChild(item);
        this.content.scrollTop = this.content.scrollHeight;
      },

      escape(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      },

      installGlobalHandlers() {
        // 1. 通常の実行時エラー (例: "Error: score is not defined")
        window.onerror = (message, source, lineno, colno, error) => {
          const errName = error ? error.name : 'Runtime Error';
          const stack = error && error.stack ? error.stack : '';
          this.reportError(
            `Error: ${errName}`,
            message,
            source,
            lineno,
            colno,
            stack
          );
          return false; // ブラウザ標準のconsoleにも出力継続
        };

        // 2. Promise の未処理例外 (Unhandled Rejection)
        window.addEventListener('unhandledrejection', (event) => {
          const reason = event.reason;
          let msg = 'Unknown rejection';
          let stack = '';

          if (reason instanceof Error) {
            msg = `${reason.name}: ${reason.message}`;
            stack = reason.stack || '';
          } else if (typeof reason === 'string') {
            msg = reason;
          }

          this.reportError(
            'Unhandled Promise Rejection',
            msg,
            '',
            '',
            '',
            stack
          );
        });

        // 3. console.error をフックしてUIにも反映
        const originalConsoleError = console.error;
        console.error = (...args) => {
          originalConsoleError.apply(console, args);
          const firstArg = args[0];
          if (firstArg instanceof Error) {
            this.reportError(firstArg.name, firstArg.message, '', '', '', firstArg.stack);
          } else {
            const formatted = args.map(a => (typeof a === 'object' ? JSON.stringify(a) : String(a))).join(' ');
            this.reportError('Console Error', formatted);
          }
        };
      }
    };

    // デバッグ監視の起動
    DebugMonitor.init();

    /**
     * =========================================================================
     *  2. STEP 1 VERIFICATION TESTS
     *  デバッグUIが正しく仕様通りエラーを表示するか検証するテストトリガー
     * =========================================================================
     */
    document.getElementById('btn-test-undef').addEventListener('click', () => {
      // 意図的な未定義変数アクセス: "ReferenceError: nonExistentPlayerScore is not defined"
      nonExistentPlayerScore += 100;
    });

    document.getElementById('btn-test-null').addEventListener('click', () => {
      // 意図的なNull参照: "TypeError: Cannot read properties of null"
      const targetEntity = null;
      targetEntity.takeDamage(50);
    });

    document.getElementById('btn-test-promise').addEventListener('click', () => {
      // 意図的なPromise Rejection
      new Promise((_, reject) => {
        setTimeout(() => {
          reject(new Error('AssetLoadError: failed to load texture "boss_final.png"'));
        }, 100);
      });
    });

    /**
     * =========================================================================
     *  3. GAME CANVAS FOUNDATION & STARFIELD LOOP
     *  解像度 480x640 の基準描画ループと星空背景演出
     * =========================================================================
     */
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // 仮想解像度
    const VIRTUAL_WIDTH = 480;
    const VIRTUAL_HEIGHT = 640;

    // パララックス星空パーティクル
    const stars = [];
    const STAR_COUNT = 65;
    for (let i = 0; i < STAR_COUNT; i++) {
      stars.push({
        x: Math.random() * VIRTUAL_WIDTH,
        y: Math.random() * VIRTUAL_HEIGHT,
        size: Math.random() < 0.7 ? 1 : (Math.random() < 0.9 ? 1.8 : 2.5),
        speed: 0.5 + Math.random() * 2.2,
        alpha: 0.3 + Math.random() * 0.7
      });
    }

    // FPS計測
    let lastTime = performance.now();
    let frameCount = 0;
    let fps = 60;
    const fpsElem = document.getElementById('dbg-fps-text');
    const coordsElem = document.getElementById('dbg-coords');

    /**
     * =========================================================================
     *  4. INPUT MANAGER (キーボード & タッチ / マウスドラッグ)
     * =========================================================================
     */
    const Input = {
      keys: {},
      touch: {
        active: false,
        touchId: null,
        offsetX: 0,
        offsetY: 0,
        lastX: 0
      },

      init(targetCanvas) {
        // キーボード入力追跡
        window.addEventListener('keydown', (e) => {
          this.keys[e.code] = true;
          // 矢印・Spaceキーによるブラウザスクロールを防止
          if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
            e.preventDefault();
          }
        });

        window.addEventListener('keyup', (e) => {
          this.keys[e.code] = false;
        });

        // タッチ操作 (相対ドラッグ方式: 指で機体が隠れないよう操作可能)
        const getCanvasCoord = (clientX, clientY) => {
          const rect = targetCanvas.getBoundingClientRect();
          const scaleX = VIRTUAL_WIDTH / rect.width;
          const scaleY = VIRTUAL_HEIGHT / rect.height;
          return {
            x: (clientX - rect.left) * scaleX,
            y: (clientY - rect.top) * scaleY
          };
        };

        targetCanvas.addEventListener('touchstart', (e) => {
          e.preventDefault();
          const t = e.touches[0];
          const pos = getCanvasCoord(t.clientX, t.clientY);
          this.touch.active = true;
          this.touch.touchId = t.identifier;
          // タッチ開始位置と自機座標のオフセットを記憶
          this.touch.offsetX = player.x - pos.x;
          this.touch.offsetY = player.y - pos.y;
          this.touch.lastX = pos.x;
        }, { passive: false });

        targetCanvas.addEventListener('touchmove', (e) => {
          if (!this.touch.active) return;
          e.preventDefault();
          for (let i = 0; i < e.touches.length; i++) {
            const t = e.touches[i];
            if (t.identifier === this.touch.touchId) {
              const pos = getCanvasCoord(t.clientX, t.clientY);
              // タッチ移動量から即座に移動速度を算出しバンキングに反映
              player.vx = (pos.x - this.touch.lastX) * 20;
              this.touch.lastX = pos.x;

              // 目標座標へ更新（クランプ付き）
              player.x = player.clamp(pos.x + this.touch.offsetX, player.radius, VIRTUAL_WIDTH - player.radius);
              player.y = player.clamp(pos.y + this.touch.offsetY, player.radius, VIRTUAL_HEIGHT - player.radius);
              break;
            }
          }
        }, { passive: false });

        const endTouch = () => {
          this.touch.active = false;
          this.touch.touchId = null;
          player.vx = 0;
          player.vy = 0;
        };
        targetCanvas.addEventListener('touchend', endTouch);
        targetCanvas.addEventListener('touchcancel', endTouch);
      },

      isDown(keyA, keyB) {
        return !!(this.keys[keyA] || this.keys[keyB]);
      }
    };

    /**
     * =========================================================================
     *  5. PLAYER ENTITY (自機クラス)
     * =========================================================================
     */
    class Player {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 16;         // 機体グラフィック半径
        this.hitRadius = 4;        // 当たり判定コア半径 (弾幕STG基準)
        this.speed = 320;          // 移動速度 (px/sec)
        this.vx = 0;
        this.vy = 0;
        this.tilt = 0;             // 左右バンキング角度 (rad)
        this.particles = [];       // スラスター噴射パーティクル
      }

      clamp(val, min, max) {
        return Math.max(min, Math.min(max, val));
      }

      update(dt) {
        // キーボード入力方向の算出
        let mx = 0;
        let my = 0;

        if (Input.isDown('ArrowLeft', 'KeyA')) mx -= 1;
        if (Input.isDown('ArrowRight', 'KeyD')) mx += 1;
        if (Input.isDown('ArrowUp', 'KeyW')) my -= 1;
        if (Input.isDown('ArrowDown', 'KeyS')) my += 1;

        // タッチ非操作時のみキーボード移動を適用
        if (!Input.touch.active) {
          // 斜め移動時の速度正規化 (斜めだけ速くなるのを防止)
          if (mx !== 0 && my !== 0) {
            mx *= Math.SQRT1_2;
            my *= Math.SQRT1_2;
          }

          this.vx = mx * this.speed;
          this.vy = my * this.speed;

          this.x += this.vx * dt;
          this.y += this.vy * dt;

          // 画面端クランプ処理 (自機が画面外へ出ないよう制限)
          this.x = this.clamp(this.x, this.radius, VIRTUAL_WIDTH - this.radius);
          this.y = this.clamp(this.y, this.radius, VIRTUAL_HEIGHT - this.radius);
        }

        // 移動時のスムーズな機体バンキング計算
        const targetTilt = (this.vx / this.speed) * 0.35; // 最大傾斜角 約20度
        this.tilt += (targetTilt - this.tilt) * 14 * dt;

        // スラスター噴射パーティクル生成
        if (Math.random() < 0.85) {
          const spread = (Math.random() - 0.5) * 8;
          this.particles.push({
            x: this.x + spread,
            y: this.y + 12,
            vx: spread * 0.2,
            vy: 100 + Math.random() * 120,
            size: 2.5 + Math.random() * 2,
            life: 1.0,
            decay: 4.0 + Math.random() * 2.5
          });
        }

        // パーティクル寿命更新
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.life -= p.decay * dt;
          if (p.life <= 0) {
            this.particles.splice(i, 1);
          }
        }
      }

      draw(ctx) {
        // 1. スラスター噴射粒子の描画
        for (const p of this.particles) {
          ctx.fillStyle = `rgba(255, ${Math.floor(100 + p.life * 130)}, 40, ${p.life * 0.85})`;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
          ctx.fill();
        }

        // 2. 自機本体（左右傾き適用）
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.tilt);

        // サイバーネオングロー
        ctx.shadowColor = '#00ffcc';
        ctx.shadowBlur = 12;

        // メインウィング (前進翼形状)
        ctx.fillStyle = '#00ffcc';
        ctx.beginPath();
        ctx.moveTo(0, -20);
        ctx.lineTo(16, 12);
        ctx.lineTo(7, 8);
        ctx.lineTo(0, 14);
        ctx.lineTo(-7, 8);
        ctx.lineTo(-16, 12);
        ctx.closePath();
        ctx.fill();

        // コックピットフレーム
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.moveTo(0, -12);
        ctx.lineTo(4, 3);
        ctx.lineTo(-4, 3);
        ctx.closePath();
        ctx.fill();

        // 翼端アクセント
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(-15, 6, 2.5, 5);
        ctx.fillRect(12.5, 6, 2.5, 5);

        // 当たり判定コア (高輝度ホワイト)
        ctx.shadowColor = '#ffffff';
        ctx.shadowBlur = 8;
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(0, 0, this.hitRadius, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    }

    // 自機インスタンス化
    const player = new Player(VIRTUAL_WIDTH / 2, VIRTUAL_HEIGHT - 120);

    // 入力マネージャーの初期化
    Input.init(canvas);

    /**
     * 更新処理
     */
    function update(dt) {
      // 星空のスクロール更新
      for (let s of stars) {
        s.y += s.speed;
        if (s.y > VIRTUAL_HEIGHT) {
          s.y = 0;
          s.x = Math.random() * VIRTUAL_WIDTH;
        }
      }

      // 自機の更新
      player.update(dt);
    }

    /**
     * 描画処理
     */
    function draw() {
      // 1. 背景クリア
      ctx.fillStyle = '#060814';
      ctx.fillRect(0, 0, VIRTUAL_WIDTH, VIRTUAL_HEIGHT);

      // 2. 星空描画
      for (let s of stars) {
        ctx.fillStyle = `rgba(200, 230, 255, ${s.alpha})`;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
      }

      // 3. 背景サイバーグリッドライン
      ctx.strokeStyle = 'rgba(0, 255, 204, 0.03)';
      ctx.lineWidth = 1;
      const gridSize = 40;
      for (let x = 0; x < VIRTUAL_WIDTH; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, VIRTUAL_HEIGHT);
        ctx.stroke();
      }

      // 4. 自機描画
      player.draw(ctx);

      // 5. ステータス & 操作ガイドHUD (Canvas内)
      ctx.fillStyle = 'rgba(0, 255, 204, 0.85)';
      ctx.font = 'bold 15px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('STEP 2: PLAYER CONTROLS ACTIVE', VIRTUAL_WIDTH / 2, 45);

      ctx.fillStyle = 'rgba(148, 163, 184, 0.7)';
      ctx.font = '11px monospace';
      ctx.fillText('MOVE: [W,A,S,D] or [↑,←,↓,→] or TOUCH DRAG', VIRTUAL_WIDTH / 2, VIRTUAL_HEIGHT - 35);
      ctx.fillText('Awaiting Step 3: Weapon Systems & Object Pool', VIRTUAL_WIDTH / 2, VIRTUAL_HEIGHT - 18);
    }

    /**
     * メインループ (requestAnimationFrame)
     */
    function loop(currentTime) {
      const dt = Math.min((currentTime - lastTime) / 1000, 0.1); // 最大dtクランプでタブ復帰時の暴走防止
      lastTime = currentTime;

      // FPSおよび座標更新
      frameCount++;
      if (frameCount % 10 === 0) {
        fps = Math.round(1 / dt);
        if (fpsElem) fpsElem.textContent = `FPS: ${fps}`;
        if (coordsElem) {
          coordsElem.textContent = `POS: ${Math.round(player.x)}, ${Math.round(player.y)}`;
        }
      }

      update(dt);
      draw();

      requestAnimationFrame(loop);
    }

    // ページロード完了後にループ開始
    window.addEventListener('load', () => {
      requestAnimationFrame((time) => {
        lastTime = time;
        loop(time);
      });
      DebugMonitor.reportInfo('Playerシステム初期化', '入力受付 & 画面端クランプ処理稼働');
    });
  </script>
</body>
</html>
